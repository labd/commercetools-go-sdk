version: 3
vars:
  apiSpecsDir: "../commercetools-api-reference/api-specs"
  generatedDir: "./generated"
  versionId: 1.5.0

tasks:
  default:
    cmd: task --list-all

  install:
    desc: Install the official rmf-codegen CLI (jar from Maven Central) into ~/.local/bin
    cmds:
      - bash install-script.sh

  test:
    cmds:
      - go test ./...

  fmt:
    cmds:
      - go fmt ./...

  coverage:
    cmds:
      - go test -race -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...
      - go tool cover -html=coverage.txt

  generate:
    cmds:
#      - task: generate-checkout
      - task: generate-connect
      - task: generate-importapi
#      - task: generate-frontend
      - task: generate-platform
      - task: generate-history
      - task: generate-insights

  generate-checkout:
    cmds:
      - task: generate-api
        vars: {apiName: checkout, path: checkout}

  generate-connect:
    cmds:
      - task: generate-api
        vars: {apiName: connect, path: connect}

  generate-importapi:
    cmds:
      - task: generate-api
        vars: {apiName: importapi, path: import}

  generate-frontend:
    cmds:
      - task: generate-api
        vars: {apiName: frontend, path: frontend-api}

  generate-platform:
    cmds:
      - task: generate-api
        vars: {apiName: platform, path: api}

  generate-history:
    cmds:
      - task: generate-api
        vars: {apiName: history, path: history}

  generate-insights:
    cmds:
      # Not using generate-api: the Datadog `US1-FED` enum value is emitted by
      # rmf-codegen as the invalid Go identifier `DatadogSiteUS1-FED`, which has
      # to be repaired before goimports/go fmt will parse the file.
      - rmf-codegen generate {{ .apiSpecsDir }}/insights/api.raml -b insights -o {{ .generatedDir }}/ -t GO_CLIENT
      - perl -p -i -e 's/^DatadogSiteUS1-FED\b/DatadogSiteUS1FED/' {{ .generatedDir }}/insights/types_configuration.go
      - goimports -w {{ .generatedDir }}/insights/
      - go fmt {{ .generatedDir }}/insights/
      - rm -rf insights/
      - mv {{ .generatedDir }}/insights .
      - perl -p -i -e 's/const Version = "1.0.1"/const Version = "{{ .versionId }}"/' insights/client.go

  generate-api:
    cmds:
      - rmf-codegen generate {{ .apiSpecsDir }}/{{ .path }}/api.raml -b {{ .apiName }} -o {{ .generatedDir }}/ -t GO_CLIENT
      - goimports -w {{ .generatedDir }}/{{ .apiName }}/
      - go fmt {{ .generatedDir }}/{{ .apiName }}/
      - rm -rf {{ .apiName }}/
      - mv {{ .generatedDir }}/{{ .apiName }} .
      - perl -p -i -e 's/const Version = "1.0.1"/const Version = "{{ .versionId }}"/' {{ .apiName }}/client.go

